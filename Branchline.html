/* Layout: drafting-table workspace. A dotted canvas holds the role tree, a detail panel sits beside it; the sign-in page pairs a pitch with two choices. */
:root{

  --muted:#556575;
  --line:#C9D3DE;
  --edge:#9FB0C2;
  --accent:#2650C0;
  --on-accent:#FFFFFF;
  --accent-soft:#DAE4FA;
  --warn:#B26700;
  --good:#16764F;
  --bad:#B3261E;
  --track:#D3DCE6;
  --dot:#BCC8D5;

  --shadow:0 1px 0 rgba(18,32,46,.04),0 10px 28px -14px rgba(18,32,46,.28);

}

  --bg:#0D141B;--panel:#141E28;--panel2:#1A2733;--ink:#E4EBF2;--muted:#93A4B4;--line:#293845;--edge:#3A4D5E;
  --accent:#7CA3FF;--on-accent:#0A1322;--accent-soft:#1E315F;--warn:#E7A640;--good:#52C794;--bad:#FF8F86;
  --track:#2B3A48;--dot:#1F2C38;--node:#101922;--shadow:0 10px 28px -14px rgba(0,0,0,.6);

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}

.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.wrap{max-width:1480px;margin:0 auto;display:grid;gap:16px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--edge)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.btn.quiet{border-color:transparent;background:transparent;color:var(--accent);padding:0 6px;min-height:34px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon:hover{color:var(--ink);background:var(--panel2)}

input[type=text],input[type=password],input[type=search],input:not([type]){font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:42px;padding:0 12px;width:100%}

input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}

.chip{display:inline-flex;align-items:center;gap:6px;font:500 11.5px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.strong{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip.sync.local::before{background:var(--warn)}
.err{color:var(--bad);font-size:13.5px;font-weight:500}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* welcome */
.welcome{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center;min-height:calc(100vh - 90px)}
.brand{display:flex;align-items:center;gap:10px;font:700 21px var(--font-display);letter-spacing:-.01em}
.pitch{display:grid;gap:22px}

.pitch p{max-width:46ch;color:var(--muted);font-size:16px}
.art{border:1px solid var(--line);border-radius:12px;background:var(--panel);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;overflow:hidden}
.art svg{display:block;width:100%;height:auto}
.panelcol{display:grid;gap:14px;align-content:center}

.choice{display:grid;gap:6px;text-align:left;padding:20px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer;color:var(--ink);width:100%;box-shadow:var(--shadow)}
.choice:hover{border-color:var(--accent)}
.choice[disabled]{opacity:.6;cursor:wait}
.choice .t{font:600 21px var(--font-display);display:flex;align-items:center;justify-content:space-between;gap:12px}

.formcard{display:grid;gap:16px;padding:22px;border:1px solid var(--line);background:var(--panel);border-radius:12px;box-shadow:var(--shadow)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pickwrap{display:grid;gap:6px;max-height:320px;overflow:auto;padding:2px}
.pick{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:8px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;min-height:52px}
.pick:hover{border-color:var(--edge)}

.pick .nm2{font-weight:600;display:block;line-height:1.25}
.pick .rl2{color:var(--muted);font-size:13px;display:block;line-height:1.25}
.pick .lv{margin-left:auto}

/* workspace */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0}
.proj-label{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.proj-name{font-size:clamp(20px,3vw,28px);line-height:1.1;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.codechip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px dashed var(--edge);border-radius:8px;background:var(--panel);cursor:pointer;color:var(--ink)}
.codechip .lbl{font-size:11px;color:var(--muted);letter-spacing:.08em}
.codechip .val{font-weight:600;letter-spacing:.1em;user-select:all}
.who{color:var(--muted);font-size:14px}
.who strong{color:var(--ink)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.canvas{border:1px solid var(--line);border-radius:12px;background:var(--panel);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;min-width:0;overflow:hidden}
.canvas-h{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.canvas-h h2{font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:500 12px var(--font-mono);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.scroll{overflow:auto;max-height:72vh}
.tree{display:block;margin:0 auto}
.tree text{font-family:var(--font-body)}
.edge{fill:none;stroke:var(--edge);stroke-width:2}
.lane{stroke:var(--line);stroke-dasharray:2 7}
.lanelbl{fill:var(--muted);font:500 11px var(--font-mono);letter-spacing:.08em}
.node{cursor:pointer;outline:none}
.node .disc{fill:var(--node)}
.node .halo{stroke:var(--accent);stroke-width:2.5;opacity:0;transition:opacity .15s}
.node:hover .halo{opacity:.45}
.node.sel .halo,.node:focus-visible .halo{opacity:1}
.nm{fill:var(--ink);font-weight:600;font-size:13.5px}
.rl{fill:var(--muted);font-size:12px}
.pct{fill:var(--ink);font:600 15px var(--font-mono)}
.pctsign{font-size:10px;fill:var(--muted)}
.youtag rect{fill:var(--accent)}
.youtag text{fill:var(--on-accent);font:600 9px var(--font-mono);letter-spacing:.06em}

.detail{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:18px;display:grid;gap:20px;min-width:0;box-shadow:var(--shadow)}
.dhead{display:flex;gap:14px;align-items:center;min-width:0}
.dhead h2{font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.dhead .role{color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.facts{display:grid;gap:8px;font-size:14px;color:var(--muted)}
.facts .links{display:flex;flex-wrap:wrap;gap:4px 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.sec{display:grid;gap:4px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.sec-h h3{font-size:16px}
.sec-h .mono{font-size:13px;color:var(--muted)}
.hint{color:var(--muted);font-size:13.5px;padding-top:8px}
ul.list{list-style:none;margin:0;padding:0;display:grid}
.goal{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.check{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.goal-text{overflow-wrap:anywhere}
.goal-text.done{color:var(--muted);text-decoration:line-through}
.goal .mono{font-size:13px;color:var(--muted);flex:none}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.sg{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sg .goal-text{flex:1;min-width:0}
.share{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--font-mono);padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;flex:none}
.share[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.addrow{display:flex;gap:8px;padding-top:12px}

/* sheet */
.back{position:fixed;inset:0;z-index:50;display:flex;overflow:auto;background:rgba(8,14,20,.55);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{margin:auto;width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px;box-shadow:var(--shadow)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-h h2{font-size:21px}
.team-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.team-row .who2{flex:1;min-width:160px}
.team-row .who2 b{display:block;line-height:1.25}
.team-row .who2 span{color:var(--muted);font-size:13px}
.gedit{display:grid;gap:8px}
.gedit-row{display:flex;gap:8px;align-items:center}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.warnbox{border:1px solid var(--bad);border-radius:10px;padding:12px 14px;display:grid;gap:6px}

.toast{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;pointer-events:none;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.toast div{pointer-events:auto;max-width:560px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:500;font-size:14px;box-shadow:var(--shadow);border:2px solid transparent}
.toast div.error{border-color:var(--bad)}

@media (max-width:960px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .welcome{grid-template-columns:minmax(0,1fr);gap:28px;min-height:0}
  .scroll{max-height:60vh}
}
@media (max-width:560px){
  .formgrid{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/*LOGIC-START*/
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

function childrenOf(nodes,id){return Object.values(nodes).filter(n=>n.parentId===id).sort((a,b)=>((a.order||0)-(b.order||0))||String(a.name).localeCompare(String(b.name)));}
function levelOf(nodes,id){let l=1,cur=nodes[id],guard=0;while(cur&&cur.parentId&&nodes[cur.parentId]&&guard++<100){l++;cur=nodes[cur.parentId];}return l;}

function demoProject(){

/* ---------- storage: shared db when available, this browser otherwise ---------- */
function makeLocalStore(){
  const mem={},subs={};
  const key=c=>"branchline:"+c;

    async get(c){return load(c);},
    async create(c,meta,nodes){save(c,{meta:meta,nodes:nodes});},
    subscribe(c,cb){const f=()=>cb(load(c));(subs[c]=subs[c]||[]).push(f);Promise.resolve().then(f);return()=>{subs[c]=subs[c].filter(x=>x!==f);};},
    async addNode(c,node){const p=load(c);if(!p)return;p.nodes[node.id]=node;save(c,p);},
    async updateNode(c,id,patch){const p=load(c);if(!p||!p.nodes[id])return;p.nodes[id]=Object.assign({},p.nodes[id],patch);save(c,p);},
    async removeNodes(c,ids){const p=load(c);if(!p)return;ids.forEach(i=>{delete p.nodes[i];});save(c,p);}};
}
function makeSharedStore(db){
  const chains={};
  const q=(k,fn)=>{const p=(chains[k]||Promise.resolve()).catch(()=>{}).then(fn);chains[k]=p;return p;};
  const mref=c=>db.doc("projects/"+c);
  const nref=(c,id)=>db.doc("projects/"+c).collection("nodes").doc(id);
  return{kind:"shared",
    async get(c){const m=await mref(c).get();if(!m.exists)return null;const s=await mref(c).collection("nodes").get();const nodes={};s.docs.forEach(d=>{nodes[d.id]=d.data();});return{meta:m.data(),nodes:nodes};},
    async create(c,meta,nodes){for(const id of Object.keys(nodes)){await nref(c,id).set(nodes[id]);}await mref(c).set(meta);},
    subscribe(c,cb,err){let m,nodes,gotM=false,gotN=false;
      const emit=()=>{if(gotM&&gotN)cb(m.exists?{meta:m.data(),nodes:nodes}:null);};
      const u1=mref(c).onSnapshot(s=>{m=s;gotM=true;emit();},err);
      const u2=mref(c).collection("nodes").onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data();});nodes=o;gotN=true;emit();},err);
      return()=>{u1();u2();};},
    addNode(c,node){return q(c+"/"+node.id,()=>nref(c,node.id).set(node));},
    updateNode(c,id,patch){return q(c+"/"+id,()=>nref(c,id).update(patch));},
    async removeNodes(c,ids){for(const id of ids){await q(c+"/"+id,()=>nref(c,id).delete());}}};
}

}

/* ---------- tree ---------- */
function TreeView({nodes,rootId,selId,meId,onSelect}){
  const L=useMemo(()=>layoutTree(nodes,rootId),[nodes,rootId]);
  const ref=useRef(null);
  const colW=172,rowH=176,gut=78,top=62,R=32,sw=7;
  const W=gut+L.leaves*colW+16,H=top+L.maxDepth*rowH+118;
  const X=id=>gut+(L.pos[id].slot+0.5)*colW,Y=id=>top+L.pos[id].depth*rowH;
  const ids=Object.keys(L.pos);
  useEffect(()=>{const el=ref.current;if(el)el.scrollLeft=Math.max(0,(el.scrollWidth-el.clientWidth)/2);},[rootId]);
  const c=2*Math.PI*R;
  return html`<div className="scroll" ref=${ref}>
    <svg className="tree" width=${W} height=${H} viewBox=${"0 0 "+W+" "+H} role="group" aria-label="Project tree">
      ${Array.from({length:L.maxDepth+1},(_,d)=>html`<g key=${"lane"+d}>
        <line className="lane" x1="0" x2=${W} y1=${top+d*rowH} y2=${top+d*rowH}/>
        <text className="lanelbl" x="14" y=${top+d*rowH-10}>LEVEL ${d+1}</text>
      </g>`)}
      ${ids.filter(id=>nodes[id].parentId&&L.pos[nodes[id].parentId]).map(id=>{
        const p=nodes[id].parentId,x1=X(p),y1=Y(p)+R+sw/2+46,x2=X(id),y2=Y(id)-R-sw/2,my=(y1+y2)/2;
        return html`<path key=${"e"+id} className="edge" d=${"M"+x1+" "+y1+"C"+x1+" "+my+" "+x2+" "+my+" "+x2+" "+y2}/>`;})}
      ${ids.map(id=>{
        const n=nodes[id],p=progressOf(n),sel=id===selId;
        return html`<g key=${id} className=${"node"+(sel?" sel":"")} transform=${"translate("+X(id)+" "+Y(id)+")"} tabIndex="0" role="button" aria-pressed=${sel}
          aria-label=${n.name+", "+n.role+", level "+(L.pos[id].depth+1)+", "+p+"% of goals done"}
          onClick=${()=>onSelect(id)} onKeyDown=${e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onSelect(id);}}}>
          <circle className="halo" r=${R+sw/2+5} fill="none"/>
          <circle className="disc" r=${R}/>
          <circle r=${R} fill="none" stroke="var(--track)" strokeWidth=${sw}/>
          ${p>0&&html`<circle r=${R} fill="none" stroke=${ringColor(p)} strokeWidth=${sw} strokeLinecap="round" strokeDasharray=${(c*p/100)+" "+c} transform="rotate(-90)"/>`}
          <text className="pct" textAnchor="middle" dy="0.35em">${p}<tspan className="pctsign">%</tspan></text>
          <text className="nm" textAnchor="middle" y=${R+sw/2+20}>${clip(n.name,20)}</text>
          <text className="rl" textAnchor="middle" y=${R+sw/2+37}>${clip(n.role,24)}</text>
          ${id===meId&&html`<g className="youtag" transform=${"translate("+(R-8)+" "+(-R-4)+")"}><rect x="0" y="-8" width="32" height="16" rx="8"/><text x="16" y="0" textAnchor="middle" dy="0.35em">YOU</text></g>`}
        </g>`;})}
    </svg>
  </div>`;
}

function GoalRow({g,editable,onCommit}){
  const [v,setV]=useState(g.pct);
  useEffect(()=>{setV(g.pct);},[g.pct]);
  const commit=()=>{if(v!==g.pct)onCommit(v);};
  if(!editable)return html`<li className="goal">
    <div className="goal-top"><span className="goal-text">${g.text}</span><span className="mono">${g.pct}%</span></div>
    <div className="bar"><i style=${{width:g.pct+"%",background:ringColor(g.pct)}}></i></div>
  </li>`;
  return html`<li className="goal">
    <div className="goal-top">
      <label className="check" htmlFor=${"cb-"+g.id}><input id=${"cb-"+g.id} type="checkbox" checked=${g.pct>=100} onChange=${()=>onCommit(g.pct>=100?0:100)}/><span className=${"goal-text"+(g.pct>=100?" done":"")}>${g.text}</span></label>

}

function Welcome({store,onEnter}){
  const [screen,setScreen]=useState("choose");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const [code,setCode]=useState("");
  const [proj,setProj]=useState(null);
  const [isDemo,setIsDemo]=useState(false);
  const [pickId,setPickId]=useState(null);
  const [pin,setPin]=useState("");
  const [pName,setPName]=useState("");
  const [uName,setUName]=useState("");
  const [uRole,setURole]=useState("Project Manager");
  const [uPin,setUPin]=useState("");
  const [uGoals,setUGoals]=useState([{id:gid(),text:"",pct:0}]);
  const ready=!!store;
  const back=()=>{setScreen("choose");setErr("");setPin("");setPickId(null);setProj(null);};

  const lookup=async(c,demo)=>{
    setBusy(true);setErr("");
    try{const p=await store.get(c);
      if(!p){setErr("No project has that code. Check it with your project manager.");}
      else{setCode(c);setProj(p);setIsDemo(!!demo);setPickId(null);setPin("");setScreen("pick");}
    }catch(e){setErr(friendly(e));}
    setBusy(false);
  };
  const openDemo=async()=>{
    setBusy(true);setErr("");
    try{let p=await store.get(DEMO_CODE);
      if(!p){const d=demoProject();await store.create(DEMO_CODE,d.meta,d.nodes);}
    }catch(e){setErr(friendly(e));setBusy(false);return;}
    setBusy(false);
    await lookup(DEMO_CODE,true);
  };
  const signIn=async e=>{
    e.preventDefault();
    const n=proj.nodes[pickId];
    if(!n)return setErr("Choose your node first.");
    if(pinCheck(n.id,pin)!==n.pinCheck)return setErr("That PIN does not match this node.");
    onEnter({code:code,nodeId:n.id,kind:store.kind});
  };
  const create=async e=>{
    e.preventDefault();
    if(!pName.trim())return setErr("Enter a project name.");
    if(!uName.trim())return setErr("Enter your name.");
    if(!uRole.trim())return setErr("Enter your role.");
    if(!/^\d{4,8}$/.test(uPin))return setErr("Set a PIN of 4 to 8 digits.");
    setBusy(true);setErr("");
    try{
      let c,tries=0;
      do{c=rnd(6,ALPH);tries++;}while((await store.get(c))&&tries<6);
      const id=nid();
      const node={id:id,parentId:null,order:1,name:uName.trim(),role:uRole.trim(),pinCheck:pinCheck(id,uPin),goals:uGoals.map(g=>({id:g.id,text:g.text.trim(),pct:0})).filter(g=>g.text),subgoals:[]};
      await store.create(c,{name:pName.trim(),rootId:id,createdAt:Date.now()},{[id]:node});
      onEnter({code:c,nodeId:id,kind:store.kind},{created:true});
    }catch(e2){setErr(friendly(e2));setBusy(false);}
  };

  let right;
  if(screen==="choose"){
    right=html`<div className="panelcol">
      <h2>Sign in</h2>
      <button type="button" className="choice" disabled=${!ready} onClick=${()=>{setErr("");setScreen("create");}}>
        <span className="t">Create a new project <${Ico} d=${P.arrow} size=${20}/></span>
        <span className="d">Start the tree as its first node. You become the project manager and set up the people directly below you.</span>
      </button>
      <button type="button" className="choice" disabled=${!ready} onClick=${()=>{setErr("");setScreen("join");}}>
        <span className="t">Join an existing project <${Ico} d=${P.arrow} size=${20}/></span>
        <span className="d">Enter the project code, pick your node and sign in with your PIN.</span>
      </button>
      <div><button type="button" className="linkbtn" disabled=${!ready||busy} onClick=${openDemo}>Look around the demo project</button></div>
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <p className="hint muted" style=${{fontSize:"13px"}}>${!ready?"Connecting to storage...":store.kind==="shared"?"Projects are stored in this page's shared database, so your team sees the same tree.":"Shared storage is not available here, so projects stay in this browser."}</p>
    </div>`;
  }else if(screen==="create"){
    right=html`<form className="formcard" onSubmit=${create}>
      <h3>New project</h3>
      <label className="fl" htmlFor="c-proj">Project name<input id="c-proj" type="text" value=${pName} onChange=${e=>setPName(e.target.value)} maxLength="80" autoFocus=${true} autoComplete="off"/></label>
      <div className="formgrid">
        <label className="fl" htmlFor="c-name">Your name<input id="c-name" type="text" value=${uName} onChange=${e=>setUName(e.target.value)} maxLength="60" autoComplete="name"/></label>
        <label className="fl" htmlFor="c-role">Your role<input id="c-role" type="text" list="role-hints" value=${uRole} onChange=${e=>setURole(e.target.value)} maxLength="60" autoComplete="off"/></label>
      </div>
      <datalist id="role-hints">${ROLE_HINTS.map(r=>html`<option key=${r} value=${r}></option>`)}</datalist>
      <label className="fl" htmlFor="c-pin">PIN for signing in<input id="c-pin" type="password" inputMode="numeric" value=${uPin} onChange=${e=>setUPin(e.target.value.replace(/\D/g,""))} maxLength="8" placeholder="4 to 8 digits" autoComplete="new-password"/></label>
      <div style=${{display:"grid",gap:"8px"}}>
        <div style=${{fontWeight:600,fontSize:"13.5px"}}>Your goals <span className="muted" style=${{fontWeight:400}}>(you can change them later)</span></div>
        <${GoalEditor} goals=${uGoals} onChange=${setUGoals} prefix="c"/>
      </div>
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <div className="row"><button type="submit" className="btn primary" disabled=${busy}>Create project</button><button type="button" className="btn" onClick=${back}>Back</button></div>
    </form>`;
  }else if(screen==="join"){
    right=html`<form className="formcard" onSubmit=${e=>{e.preventDefault();const c=code.trim().toUpperCase();if(!c)return setErr("Enter the project code.");lookup(c,false);}}>
      <h3>Join a project</h3>
      <label className="fl" htmlFor="j-code">Project code<input id="j-code" type="text" value=${code} onChange=${e=>setCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,""))} maxLength="12" autoFocus=${true} autoComplete="off" placeholder="For example K7M4QX" style=${{fontFamily:"var(--font-mono)",letterSpacing:".1em"}}/>
        <span className="help">Your project manager can copy it from the top of the project page.</span></label>
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <div className="row"><button type="submit" className="btn primary" disabled=${busy}>Find project</button><button type="button" className="btn" onClick=${back}>Back</button></div>
    </form>`;
  }else{
    const order=[];
    if(proj){const walk=(id,d)=>{order.push({n:proj.nodes[id],d:d});childrenOf(proj.nodes,id).forEach(k=>walk(k.id,d+1));};if(proj.nodes[proj.meta.rootId])walk(proj.meta.rootId,1);}
    right=html`<form className="formcard" onSubmit=${signIn}>
      <h3>${proj.meta.name}</h3>
      <div style=${{display:"grid",gap:"8px"}}>
        <div style=${{fontWeight:600,fontSize:"13.5px"}}>Choose your node</div>
        <div className="pickwrap">${order.map(o=>html`<button key=${o.n.id} type="button" className="pick" aria-pressed=${pickId===o.n.id} style=${{paddingLeft:(12+(o.d-1)*14)+"px"}} onClick=${()=>{setPickId(o.n.id);setErr("");}}>
          <span><span className="nm2">${o.n.name}</span><span className="rl2">${o.n.role}</span></span><span className="chip lv">Level ${o.d}</span></button>`)}</div>
      </div>
      <label className="fl" htmlFor="j-pin">Your PIN<input id="j-pin" type="password" inputMode="numeric" value=${pin} onChange=${e=>setPin(e.target.value.replace(/\D/g,""))} maxLength="8" autoComplete="current-password"/>
        ${isDemo&&html`<span className="help">Every person in the demo has the PIN 1111.</span>`}</label>
      ${err&&html`<div className="err" role="alert">${err}</div>`}
      <div className="row"><button type="submit" className="btn primary" disabled=${!pickId||pin.length<4}>Sign in</button><button type="button" className="btn" onClick=${back}>Back</button></div>
    </form>`;
  }

  return html`<div className="welcome">
    <div className="pitch">
      <div className="brand"><${Mark}/>Branchline</div>
      <h1>Every role in the project, and how far its goals have come.</h1>
      <p>Build the tree level by level. Each node holds a role, a person and a goal checklist, and the ring around it fills as goals get done.</p>
      <div className="art"><${MiniTree}/></div>
    </div>
    ${right}
  </div>`;
}

/* ---------- workspace ---------- */
function Workspace({store,session,first,onExit}){
  const code=session.code,meId=session.nodeId;
  const [project,setProject]=useState(undefined);
  const [slow,setSlow]=useState(false);
  const [selId,setSelId]=useState(meId);
  const [sheet,setSheet]=useState(null);
  const [notice,setNotice]=useState(first?{kind:"ok",text:"Project created. Share the code "+code+" so your team can sign in."}:null);

  useEffect(()=>{
    let done=false;
    const t=setTimeout(()=>{if(!done)setSlow(true);},10000);
    const un=store.subscribe(code,p=>{done=true;clearTimeout(t);setSlow(false);setProject(p);},e=>{done=true;clearTimeout(t);setProject(null);setNotice({kind:"error",text:friendly(e)});});
    return()=>{done=true;clearTimeout(t);un();};
  },[store,code]);
  useEffect(()=>{if(!notice)return;const t=setTimeout(()=>setNotice(null),notice.kind==="error"?9000:6500);return()=>clearTimeout(t);},[notice]);
  const close=()=>setSheet(null);

  if(project===undefined)return html`<div className="shell"><div className="wrap"><div className="detail" style=${{maxWidth:"460px",margin:"10vh auto 0"}}><h2>Loading project</h2><p className="muted">${slow?"The shared storage is slow to answer. Keep this page open; the tree appears once it responds.":"Fetching the tree."}</p><button type="button" className="btn" onClick=${onExit}>Back to sign in</button></div></div></div>`;
  if(!project||!project.nodes[meId])return html`<div className="shell"><div className="wrap"><div className="detail" style=${{maxWidth:"460px",margin:"10vh auto 0"}}><h2>Project not available</h2><p className="muted">This project was removed, or your node is no longer part of it.</p><button type="button" className="btn primary" onClick=${onExit}>Back to sign in</button></div></div></div>`;

  const nodes=project.nodes,rootId=project.meta.rootId,me=nodes[meId];
  const sel=nodes[selId]?selId:meId;
  const run=async fn=>{try{await fn();return true;}catch(e){setNotice({kind:"error",text:friendly(e)});return false;}};

  const act={
    setGoal:(nid2,gid2,v)=>run(()=>store.updateNode(code,nid2,{goals:(nodes[nid2].goals||[]).map(g=>g.id===gid2?Object.assign({},g,{pct:v}):g)})),
    addSub:(nid2,t)=>run(()=>store.updateNode(code,nid2,{subgoals:(nodes[nid2].subgoals||[]).concat([{id:gid(),text:t,done:false,shared:false}])})),
    toggleSub:(nid2,sid)=>run(()=>store.updateNode(code,nid2,{subgoals:(nodes[nid2].subgoals||[]).map(s=>s.id===sid?Object.assign({},s,{done:!s.done}):s)})),
    shareSub:(nid2,sid)=>run(()=>store.updateNode(code,nid2,{subgoals:(nodes[nid2].subgoals||[]).map(s=>s.id===sid?Object.assign({},s,{shared:!s.shared}):s)})),
    removeSub:(nid2,sid)=>run(()=>store.updateNode(code,nid2,{subgoals:(nodes[nid2].subgoals||[]).filter(s=>s.id!==sid)}))
  };
  const saveNew=v=>run(async()=>{
    const id=nid();
    await store.addNode(code,{id:id,parentId:meId,order:Date.now(),name:v.name,role:v.role,pinCheck:pinCheck(id,v.pin),goals:v.goals.map(g=>({id:gid(),text:g.text,pct:0})),subgoals:[]});
    setSelId(id);setSheet(null);setNotice({kind:"ok",text:v.name+" added. They sign in with code "+code+" and the PIN you set."});
  });
  const saveEdit=(id,v)=>run(async()=>{
    const patch={name:v.name,role:v.role,goals:v.goals.map(g=>({id:g.id||gid(),text:g.text,pct:g.pct||0}))};
    if(v.pin)patch.pinCheck=pinCheck(id,v.pin);
    await store.updateNode(code,id,patch);
    setSheet(null);setNotice({kind:"ok",text:"Saved changes to "+v.name+"."});
  });
  const doRemove=id=>run(async()=>{
    const ids=[id].concat(descendantsOf(nodes,id)),name=nodes[id].name;
    await store.removeNodes(code,ids);
    if(ids.indexOf(selId)>=0)setSelId(meId);
    setSheet(null);setNotice({kind:"ok",text:ids.length>1?name+" and "+(ids.length-1)+" below them were removed.":name+" was removed."});
  });
  const copyCode=()=>{
    const ok=()=>setNotice({kind:"ok",text:"Project code "+code+" copied."});
    const fail=()=>setNotice({kind:"ok",text:"Select the code and copy it: "+code});
    try{navigator.clipboard.writeText(code).then(ok,fail);}catch(e){fail();}
  };

  let sheetEl=null;
  if(sheet){
    if(sheet.type==="team"){
      const managed=[me].concat(childrenOf(nodes,meId));
      sheetEl=html`<${Sheet} title="Manage team" onClose=${close}>
        <p className="muted">You can edit your own node and the people directly below you, and add people under your node.</p>
        <div><button type="button" className="btn primary" onClick=${()=>setSheet({type:"add"})}><${Ico} d=${P.plus}/> Add team member</button></div>
        <div>${managed.map(n=>html`<div key=${n.id} className="team-row">
          <${Ring} pct=${progressOf(n)} size=${38} stroke=${5}/>
          <div className="who2"><b>${n.name}</b><span>${n.role}${n.id===meId?" (you)":""}</span></div>
          <button type="button" className="btn" onClick=${()=>setSheet({type:"edit",id:n.id})}><${Ico} d=${P.edit} size=${15}/> Edit</button>
          ${n.id!==meId&&html`<button type="button" className="btn danger" onClick=${()=>setSheet({type:"remove",id:n.id})}><${Ico} d=${P.trash} size=${15}/> Remove</button>`}
        </div>`)}</div>
      <//>`;
    }else if(sheet.type==="add"){
      sheetEl=html`<${Sheet} title="Add team member" onClose=${close}><${NodeForm} mode="add" parent=${me.name} level=${levelOf(nodes,meId)+1} onSubmit=${saveNew} onCancel=${close}/><//>`;
    }else if(sheet.type==="edit"&&nodes[sheet.id]&&canManage(nodes,meId,sheet.id)){
      const n=nodes[sheet.id];
      sheetEl=html`<${Sheet} title=${"Edit "+n.name} onClose=${close}><${NodeForm} key=${n.id} mode="edit" node=${n} level=${levelOf(nodes,n.id)} onSubmit=${v=>saveEdit(n.id,v)} onCancel=${close}/><//>`;
    }else if(sheet.type==="remove"&&nodes[sheet.id]&&canRemove(nodes,meId,sheet.id)){
      const n=nodes[sheet.id],below=descendantsOf(nodes,n.id).map(i=>nodes[i].name);
      sheetEl=html`<${Sheet} title=${"Remove "+n.name+"?"} onClose=${close}>
        <div className="warnbox"><div>${n.name}, ${n.role}, and their goals and sub-goals will be deleted.</div>
          ${below.length>0&&html`<div>${below.length===1?"1 person below them is":below.length+" people below them are"} removed too: ${below.join(", ")}.</div>`}
          <div className="muted">This cannot be undone.</div></div>
        <div className="row"><button type="button" className="btn danger" onClick=${()=>doRemove(n.id)}>Remove from the tree</button><button type="button" className="btn" onClick=${close}>Keep</button></div>
      <//>`;
    }
  }

  return html`<div className="shell"><div className="wrap">
    <header className="top">
      <div className="brandrow"><${Mark}/><div style=${{minWidth:0}}><div className="proj-label mono">PROJECT</div><h1 className="proj-name">${project.meta.name}</h1></div></div>
      <div className="top-actions">
        <button type="button" className="codechip" onClick=${copyCode} title="Copy project code"><span className="mono lbl">CODE</span><span className="mono val">${code}</span><${Ico} d=${P.copy} size=${14}/></button>
        <span className=${"chip sync "+store.kind}>${store.kind==="shared"?"Shared, live":"This browser only"}</span>
        <button type="button" className="btn" onClick=${()=>setSheet({type:"team"})}><${Ico} d=${P.users}/> Manage team</button>
        <button type="button" className="btn" onClick=${onExit}><${Ico} d=${P.out}/> Sign out</button>
      </div>
    </header>
    <div className="who">Signed in as <strong>${me.name}</strong>, ${me.role}, level ${levelOf(nodes,meId)}. You can edit your own node and the people directly below you.</div>
    <div className="stage">
      <section className="canvas" aria-label="Project tree">
        <div className="canvas-h"><h2>Project tree</h2>
          <div className="legend"><span><i style=${{background:"var(--warn)"}}></i>under 40%</span><span><i style=${{background:"var(--accent)"}}></i>40 to 99%</span><span><i style=${{background:"var(--good)"}}></i>all goals done</span></div></div>
        <${TreeView} nodes=${nodes} rootId=${rootId} selId=${sel} meId=${meId} onSelect=${setSelId}/>
      </section>
      <aside aria-label="Selected node">
        <${Detail} nodes=${nodes} meId=${meId} selId=${sel} onSelect=${setSelId} onEdit=${id=>setSheet({type:"edit",id:id})} onRemove=${id=>setSheet({type:"remove",id:id})} onAdd=${()=>setSheet({type:"add"})} act=${act}/>
      </aside>
    </div>
  </div>
  ${sheetEl}
  ${notice&&html`<div className="toast" role="status"><div className=${notice.kind}>${notice.text}</div></div>`}
  </div>`;
}

/* ---------- app ---------- */
function App(){
  const [store,setStore]=useState(null);
  const [session,setSession]=useState(null);
  const [first,setFirst]=useState(false);
  useEffect(()=>{
    let dead=false;
    (async()=>{
      let s=null;
      try{const db=window.claude&&window.claude.use?await window.claude.use("db"):null;if(db)s=makeSharedStore(db);}catch(e){}
      if(!s)s=makeLocalStore();
      if(dead)return;
      setStore(s);
      try{const v=JSON.parse(localStorage.getItem(SKEY)||"null");if(v&&v.code&&v.nodeId&&v.kind===s.kind)setSession(v);}catch(e){}
    })();
    return()=>{dead=true;};
  },[]);
  const enter=(s,opts)=>{try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}setFirst(!!(opts&&opts.created));setSession(s);};
  const exit=()=>{try{localStorage.removeItem(SKEY);}catch(e){}setFirst(false);setSession(null);};
  if(store&&session)return html`<${Workspace} key=${session.code+session.nodeId} store=${store} session=${session} first=${first} onExit=${exit}/>`;
  return html`<div className="shell"><div className="wrap"><${Welcome} store=${store} onEnter=${enter}/></div></div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>

</body></html>
